name: Bug report
description: Report a reproducible problem without including student data or credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include names, student IDs, timetable contents, cookies, MitID details, OAuth tokens, or security vulnerabilities. Report vulnerabilities privately as described in SECURITY.md.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Brave, Firefox, Safari]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lectio Sync version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps using only synthetic or redacted data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
